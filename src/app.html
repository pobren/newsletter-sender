<style>

header{overflow:hidden}

.bar{max-width:1320px}

/* Set up wizard: one step a page, a step bar like the mover */
.wtitle{display:flex;gap:14px;align-items:center}.blogo{flex:none;display:block}.lic.aws{background:#fff;border:1px solid var(--line)}
.found{display:flex;gap:16px;align-items:center;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:#fff;margin:14px 0 18px}.found>div{flex:1;min-width:0}.found>div>b{display:block;font-size:17px}.found small{display:block;color:var(--muted);font-size:14px;margin-top:2px}.found .okmsg .ico{width:24px;height:24px}

.astep{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}.anum{flex:none;width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;font-weight:700;display:grid;place-items:center;margin-top:8px}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;margin:0;font-weight:600}.switch input{position:absolute;opacity:0;width:0;height:0}.switch span{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}.switch span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}.switch input:checked+span{background:#16a34a}.switch input:checked+span::after{transform:translateX(18px)}.switch input:focus-visible+span{outline:3px solid var(--pink)}
.empty{text-align:center;padding:32px 20px}
.rcards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}
.rcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.rcard::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--rc)}
.rcard .rbig{font-size:34px;font-weight:800;letter-spacing:-.02em;color:var(--rc);line-height:1.1}.rcard b{font-size:16px}.rcard .muted{font-size:14px}
.rsub{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.r-open{--rc:#16a34a}.r-click{--rc:var(--c)}.r-ctor{--rc:#0d9488}.r-unsub{--rc:#ea580c}.r-bounce{--rc:#334155}.r-spam{--rc:#0f172a}
.pbtns{display:inline-flex;gap:2px;vertical-align:middle;margin-left:4px}.pbtns .icon-btn{width:28px;height:28px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px;margin-bottom:18px}.rgrid .card{margin:0}
.rchart h2,.card h2:has(.ico){display:flex;gap:8px;align-items:center}
.rbar{display:grid;grid-template-columns:minmax(110px,150px) 1fr 70px 52px;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.rbar>span{display:flex;gap:6px;align-items:center;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rbar b{text-align:right}.rbar small{color:var(--muted);text-align:right}
.rtrack{height:14px;background:var(--soft);border-radius:8px;overflow:hidden}.rtrack i{display:block;height:100%;border-radius:8px;background:var(--c)}
.flag{font-style:normal;font-size:18px}
.tablewrap{overflow-x:auto}.rlinks{width:100%;border-collapse:collapse;font-size:14px}.rlinks th{text-align:left;color:var(--muted);font-weight:650;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.rlinks td{padding:10px 8px;border-bottom:1px solid var(--line)}.rlinks td:first-child{word-break:break-all;min-width:220px}.rlinks td:not(:first-child){white-space:nowrap}
@media(max-width:760px){.rcards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.rbar{grid-template-columns:1fr 56px;row-gap:4px}.rbar>span{grid-column:1/-1}.rbar .rtrack{grid-column:1}.rbar small{display:none}}

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const main = $("#main");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const icon = (n) => `<svg class="ico" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const num = (n) => Number(n || 0).toLocaleString("en-GB");
const when = (s) => (s ? new Date(s).toLocaleString("en-GB", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "");
const STATUS = { draft: "Draft", scheduled: "Scheduled", sending: "Sending", paused: "Paused", sent: "Sent", cancelled: "Stopped", active: "Subscribed", pending: "Unconfirmed", blocked: "Blocked", unsubscribed: "Unsubscribed", bounced: "Bounced", complained: "Marked as spam" };
const pill = (s) => `<span class="pill ${esc(s)}">${esc(STATUS[s] || s)}</span>`;
let timer = null;
const showName = (b) => { const n = (b && b.app_name) || "Newsletter Sender"; $("#appName").textContent = n; document.title = n; };
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} } };
const fold = (mini) => { document.body.classList.toggle("slim", mini); const b = $("#fold"); const t = mini ? "Make the menu bigger" : "Make the menu smaller"; b.title = t; b.setAttribute("aria-label", t); };
fold(store.get("ns.menu") === "mini");
$("#fold").onclick = () => { const mini = !document.body.classList.contains("slim"); store.set("ns.menu", mini ? "mini" : null); fold(mini); };
let view = new AbortController(); // listeners for the open view, dropped when you move on

async function api(path, opts = {}) {
	const res = await fetch(path, { method: opts.method || (opts.body ? "POST" : "GET"), headers: opts.body && !(opts.body instanceof FormData) ? { "content-type": "application/json" } : {}, body: opts.body instanceof FormData ? opts.body : opts.body ? JSON.stringify(opts.body) : undefined });
	const data = await res.json().catch(() => ({}));
	if (res.status === 401 && !opts.quiet) { boot(); throw new Error("Please sign in."); }
	if (!res.ok) throw new Error(data.error || "Something went wrong. Please try again.");
	return data;
}
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 3500); }
async function run(btn, fn) {
	const was = btn && btn.disabled; if (btn) btn.disabled = true;
	try { return await fn(); } catch (e) { toast(e.message); } finally { if (btn) btn.disabled = was; }
}
function copyBtn(text) { return `<button class="icon-btn" type="button" title="Copy" data-copy="${esc(text)}">${icon("copy")}</button>`; }
document.addEventListener("click", (e) => { const b = e.target.closest("[data-copy]"); if (b) { navigator.clipboard.writeText(b.dataset.copy).then(() => toast("Copied")); } });
function modal(html) { const m = document.createElement("div"); m.className = "modal"; m.innerHTML = `<div class="card">${html}</div>`; m.addEventListener("click", (e) => { if (e.target === m || e.target.closest("[data-close]")) m.remove(); }); document.body.append(m); return m; }
function robot(state) { return state.turnstile ? `<div class="cf-turnstile" data-sitekey="${esc(state.turnstile)}" data-response-field-name="ts" style="margin-top:14px"></div>` : ""; }
function loadTurnstile(state) { if (state.turnstile && !window.turnstile) { const s = document.createElement("script"); s.src = "https://challenges.cloudflare.com/turnstile/v0/api.js"; s.async = true; document.head.append(s); } }

// -- Set-up and sign in -------------------------------------------------------------------------
async function boot() {
	clearInterval(timer);
	const state = await api("/api/state", { quiet: true });
	const code = new URLSearchParams(location.search).get("code");
	if (code || !state.setUp) return setupScreen(state, code);
	if (!state.signedIn) return signinScreen(state);
	$("#top").hidden = $("#side").hidden = false;
	api("/api/brand").then(showName).catch(() => {});
	window.onhashchange = route;
	route();
}
function setupScreen(state, code) {
	$("#top").hidden = $("#side").hidden = true;
	if (!code) {
		main.innerHTML = `<div class="center card"><h1>Welcome to Newsletter Sender</h1><p>To make your account, open the set-up link from when you installed it: <code>/setup?code=your-code</code>.</p>${state.setupTokenOk ? "" : `<p class="err">The SETUP_TOKEN secret isn't set yet (or is still the example). Add it under your Worker's Settings, Variables and Secrets, then use that code.</p>`}</div>`;
		return;
	}
	main.innerHTML = `<form class="center card" id="f"><h1>${state.setUp ? "Reset your sign in" : "Make your account"}</h1><p class="muted">${state.setUp ? "Choose a new password. Everything else stays as it is." : "This is the only account. You can change everything later."}</p>
	<label for="email">Your email address</label><input id="email" type="email" required autocomplete="email">
	${state.setUp ? "" : `<label for="name">Your name</label><input id="name" autocomplete="name">`}
	<label for="pw">Password</label><input id="pw" type="password" minlength="10" required autocomplete="new-password"><p class="hint">At least 10 characters.</p>${robot(state)}
	<p class="err" id="e"></p><button class="btn">${icon("check")}${state.setUp ? "Save and sign in" : "Make my account"}</button></form>`;
	loadTurnstile(state);
	$("#f").onsubmit = async (e) => {
		e.preventDefault();
		try {
			await api("/api/setup", { body: { code, email: $("#email").value, name: $("#name")?.value, password: $("#pw").value, ts: $("[name=ts]")?.value } });
			history.replaceState(null, "", "/#campaigns"); boot();
		} catch (err) { $("#e").textContent = err.message; window.turnstile?.reset(); }
	};
}
function signinScreen(state) {
	$("#top").hidden = $("#side").hidden = true;
	main.innerHTML = `<form class="center card" id="f"><h1>Sign in</h1><label for="email">Email address</label><input id="email" type="email" required autocomplete="email"><label for="pw">Password</label><input id="pw" type="password" required autocomplete="current-password">${robot(state)}<p class="err" id="e"></p><button class="btn">${icon("out")}Sign in</button><p class="hint" style="margin-top:14px">Forgotten your password? Open your set-up link again to choose a new one.</p></form>`;
	loadTurnstile(state);
	$("#f").onsubmit = async (e) => { e.preventDefault(); try { await api("/api/signin", { body: { email: $("#email").value, password: $("#pw").value, ts: $("[name=ts]")?.value } }); boot(); } catch (err) { $("#e").textContent = err.message; window.turnstile?.reset(); } };
}
$("#signout").onclick = async () => { await api("/api/signout", { body: {} }); location.hash = ""; boot(); };

function route() {
	clearInterval(timer);
	view.abort(); view = new AbortController(); window.onbeforeunload = null;
	let [v, id, extra] = (location.hash.slice(1) || "campaigns").split("/");
	// Older addresses still land somewhere sensible.

const KIND = { subscribed: "Subscribed", signed_up: "Signed up (not confirmed yet)", unsubscribed: "Unsubscribed", removed: "Taken off a list", blocklist: "Blocklist", bounced: "Bounced (won't be emailed again)", soft_bounce: "Bounced for now", complained: "Marked an email as spam", imported: "Imported", "campaign.started": "Started sending", "campaign.sent": "Finished sending", "campaign.paused": "Sending paused", "campaign.cancelled": "Sending stopped", "campaign.not_sent": "Scheduled email didn't go", "sending.connected": "Sending connected" };
function statsHtml(s, total, tracking) {
	const tr = tracking === true ? { opens: true, clicks: true } : tracking || {};
	const done = s.sent + s.failed + s.skipped;
	const pct = total ? Math.round((done / total) * 100) : 0;
	return `${s.queued ? `<div class="progress"><i style="width:${pct}%"></i></div><p class="muted">${num(done)} of ${num(total)} done</p>` : ""}
	<div class="stats"><div class="stat"><p>Sent</p><b>${num(s.sent)}</b></div><div class="stat"><p>Bounced</p><b>${num(s.bounced)}</b></div><div class="stat"><p>Unsubscribed</p><b>${num(s.unsubscribed)}</b></div><div class="stat"><p>Marked as spam</p><b>${num(s.complained)}</b></div>
	${s.failed ? `<div class="stat"><p>Didn't go</p><b>${num(s.failed)}</b></div>` : ""}${tr.opens ? `<div class="stat"><p>Unique opens</p><b>${num(s.opens)}</b></div>` : ""}${tr.clicks ? `<div class="stat"><p>Unique clicks</p><b>${num(s.clicks)}</b></div>` : ""}</div>`;
}
/** "2 days ago", the way people say it. */
function ago(s) {
	if (!s) return "";
	const d = (Date.now() - new Date(s).getTime()) / 1000;
	const n = (x, u) => `${x} ${u}${x === 1 ? "" : "s"} ago`;
	if (d < 0) return when(s);
	if (d < 3600) return d < 120 ? "just now" : n(Math.floor(d / 60), "minute");
	if (d < 86400) return n(Math.floor(d / 3600), "hour");
	if (d < 7 * 86400) return n(Math.floor(d / 86400), "day");
	if (d < 30 * 86400) return n(Math.floor(d / (7 * 86400)), "week");
	return when(s).split(",")[0];
}

// -- Sending health: bounces, spam complaints and the sending service's limits, at a glance ------------------------
const LV = { good: ["Good", "good"], ok: ["Keep an eye on it", "ok"], bad: ["Too high", "bad"], few: ["Not enough sent yet to tell", "few"] };
const pc2 = (n, of) => (of ? `${((n / of) * 100).toLocaleString("en-GB", { maximumFractionDigits: 2 })}%` : "0%");
function healthHtml(h) {
	const ses = h.ses && !h.ses.error ? h.ses : null;

	const all = lv.includes("bad") ? ["Needs you now", "bad", "alert"] : lv.includes("ok") ? ["Needs a look", "ok", "alert"] : ["All healthy", "good", "check"];
	const tile = (cls, big, label, line, extra = "") => `<div class="htile h-${cls}"><span class="hbig">${big}</span><b>${label}</b><span class="muted">${line}</span>${extra}</div>`;
	const name = (PROVIDERS.find((p) => p[0] === h.provider) || [])[1] || "Your sending service";
	const left = ses ? Math.max(0, ses.max24 - ses.sent24) : 0;
	const used = ses ? Math.min(100, (ses.sent24 / Math.max(1, ses.max24)) * 100) : 0;
	const region = (REGIONS.find((r) => r[0] === h.region) || [])[1];
	return `<div class="card health"><div class="row hhead">${logo(h.provider)}<h2 class="grow">Sending health</h2><span class="hpill h-${all[1]}">${icon(all[2])}${all[0]}</span></div>
	<div class="htiles">
		${tile(LV[h.bounceLevel][1], pc2(h.bounced, h.sent), "Bounced", `${LV[h.bounceLevel][0]}. Under 2% is good, Amazon worries at 5%.`)}
		${tile(LV[h.complaintLevel][1], pc2(h.complained, h.sent), "Marked as spam", `${LV[h.complaintLevel][0]}. Under 0.05% is good, Amazon worries at 0.1%.`)}
		${ses ? tile(used > 90 ? "bad" : used > 70 ? "ok" : "good", num(left), "Left to send today", `${num(ses.sent24)} of ${num(ses.max24)} used in the last 24 hours`, `<div class="hmeter"><i style="width:${used}%"></i></div>`) : tile("few", num(h.sent), "Sent", "In the last 30 days")}
		${ses ? tile(acctBad ? "bad" : ses.production ? "good" : "ok", acctBad ? "Stopped" : ses.production ? "On" : "Sandbox", `${esc(name)}${region ? ` (${region})` : ""}`, acctBad ? "Amazon has paused or is reviewing your account. Check the SES console and your email from AWS." : ses.production ? `Up to ${num(ses.rate)} emails a second` : `Only verified addresses get emails. <a href="https://newslettersender.com/help/amazon-ses/#sandbox" target="_blank" rel="noopener">Leave the sandbox</a>`) : tile("good", "On", esc(name), "Connected")}
	</div>
	${h.ses?.error ? `<p class="err">We couldn't check Amazon SES just now: ${esc(h.ses.error)}</p>` : ""}
	${h.paused.map((p) => `<div class="hpaused">${icon("alert")}<div><a href="#email/${p.id}"><b>${esc(p.name)}</b> is paused</a>${p.why ? `<br><span class="muted">${esc(p.why)}</span>` : ""}</div></div>`).join("")}
	<p class="hint">The last 30 days (${num(h.sent)} emails). If one email bounces over 5% or gets marked as spam over 0.2%, we pause it for you before your sending service steps in.</p></div>`;

	const left = speed > 0 ? Math.ceil((total - done) / speed) : 0;
	const mins = left >= 90 ? `about ${Math.round(left / 60)} minutes left` : left > 0 ? `about ${left} seconds left` : "";
	const paused = c.status === "paused";
	return `<div class="live ${paused ? "paused" : ""}"><div class="lhead"><span class="lbig">${p < 10 ? p.toFixed(1) : Math.floor(p)}%</span><span class="muted">${paused ? "Paused" : c.status === "sending" ? "Sending" : "Queued"}: ${num(done)} of ${num(c.total)}</span><span class="grow"></span>${speed > 0 && !paused ? `<span class="lspeed">${icon("send")}${num(Math.round(speed))} a second${mins ? ` · ${mins}` : ""}</span>` : ""}</div><div class="progress big"><i style="width:${p}%"></i></div></div>`;
}

// -- Campaign report: big numbers, an activity chart, countries and links, with the people behind each one ---------------
const ppl = (n) => `${num(n)} ${n === 1 ? "person" : "people"}`;
const pct = (n, of) => (of ? `${(Math.round((n / of) * 1000) / 10).toLocaleString("en-GB")}%` : "0%");
const flag = (cc) => String.fromCodePoint(...[...cc].map((ch) => 127397 + ch.charCodeAt(0)));
const regionName = (() => { try { const d = new Intl.DisplayNames(["en-GB"], { type: "region" }); return (cc) => d.of(cc) || cc; } catch { return (cc) => cc; } })();
/** Download or add-to-a-list buttons for the people behind a number. */
const peopleBtns = (id, who, n = 0, label = "") => `<span class="pbtns"><a class="icon-btn" href="/api/campaigns/${id}/people?who=${who}${n ? `&n=${n}` : ""}" title="Download ${label} as a CSV" download>${icon("download")}</a><button class="icon-btn" type="button" data-addto="${who}" data-n="${n}" data-label="${esc(label)}" title="Add ${label} to a list">${icon("plus")}</button></span>`;
function reportHtml(c) {
	const s = c.stats, sent = s.sent, tr = c.tracking || {};
	const unopened = Math.max(0, sent - s.opens - s.bounced);
	const card = (cls, big, label, line, extra = "") => `<div class="rcard ${cls}"><span class="rbig">${big}</span><b>${label}</b><span class="muted">${line}</span>${extra}</div>`;
	const off = (what) => `<span class="muted">${what} tracking is off. <a href="#settings/tracking">Turn it on</a> for your next email.</span>`;
	const cards = `<div class="rcards">
		${tr.opens ? card("r-open", pct(s.opens, sent), "Opened", `${ppl(s.opens)}, ${num(s.allOpens)} opens in all ${peopleBtns(c.id, "opened", 0, "people who opened")}`, `<div class="rsub">${num(unopened)} didn't open ${peopleBtns(c.id, "unopened", 0, "people who didn't open")}</div>`) : card("r-open", "Off", "Opened", off("Open"))}
		${tr.clicks ? card("r-click", pct(s.clicks, sent), "Clicked a link", `${ppl(s.clicks)} ${peopleBtns(c.id, "clicked", 0, "people who clicked")}`) : card("r-click", "Off", "Clicked a link", off("Click"))}
		${tr.opens && tr.clicks ? card("r-ctor", pct(s.clicks, s.opens), "Click to open", "Of the people who opened, how many clicked") : ""}
		${card("r-unsub", pct(s.unsubscribed, sent), "Unsubscribed", `${ppl(s.unsubscribed)} ${s.unsubscribed ? peopleBtns(c.id, "unsubscribed", 0, "people who unsubscribed") : ""}`)}
		${card("r-bounce", pct(s.bounced, sent), "Bounced", `${ppl(s.bounced)} ${s.bounced ? peopleBtns(c.id, "bounced", 0, "people who bounced") : ""}`)}
		${card("r-spam", pct(s.complained, sent), "Marked as spam", `${ppl(s.complained)}`)}
	</div>`;
	const bars = [["Delivered", sent, "var(--muted)"], ...(tr.opens ? [["Opened", s.opens, "#16a34a"], ["Didn't open", unopened, "#eab308"]] : []), ...(tr.clicks ? [["Clicked", s.clicks, "var(--c)"]] : []), ["Unsubscribed", s.unsubscribed, "#ea580c"], ["Bounced", s.bounced, "#334155"], ["Marked as spam", s.complained, "#0f172a"]];
	const top = Math.max(1, sent);
	const activity = `<div class="card rchart"><h2>${icon("chart")}Activity</h2>${bars.map(([n, v, col]) => `<div class="rbar"><span>${n}</span><div class="rtrack"><i style="width:${Math.max(v ? 0.6 : 0, (v / top) * 100)}%;background:${col}"></i></div><b>${num(v)}</b><small>${pct(v, sent)}</small></div>`).join("")}</div>`;
	const cs = c.countries || [];
	const ctotal = cs.reduce((a, x) => a + x.n, 0);
	const countries = cs.length ? `<div class="card rchart"><h2>${icon("globe")}Top countries</h2>${cs.map((x) => `<div class="rbar"><span><i class="flag">${flag(x.country)}</i>${esc(regionName(x.country))}</span><div class="rtrack"><i style="width:${(x.n / cs[0].n) * 100}%"></i></div><b>${num(x.n)}</b><small>${pct(x.n, ctotal)}</small></div>`).join("")}<p class="hint">From the people who opened or clicked. We only keep the country, never the IP address.</p></div>` : "";
	const short = (u) => { try { const x = new URL(u); const q = [...x.searchParams.keys()].filter((k) => !k.startsWith("utm_")); return x.host.replace(/^www\./, "") + (x.pathname === "/" ? "" : x.pathname) + (q.length ? "?…" : ""); } catch { return u; } };
	const links = c.links.length ? `<div class="card"><h2>${icon("link")}Link activity</h2><div class="tablewrap"><table class="rlinks"><thead><tr><th>Link</th><th>People</th><th>Click %</th><th>Click to open</th><th>Clicks</th><th></th></tr></thead><tbody>${c.links.map((l) => `<tr><td><a href="${esc(l.url)}" target="_blank" rel="noopener" title="${esc(l.url)}">${esc(short(l.url))}</a></td><td>${num(l.people)}</td><td>${pct(l.people, sent)}</td><td>${tr.opens ? pct(l.people, s.opens) : "-"}</td><td>${num(l.clicks)}</td><td>${peopleBtns(c.id, "link", l.n, "people who clicked this link")}</td></tr>`).join("")}</tbody></table></div></div>` : "";
	return sent ? `${cards}<div class="rgrid">${activity}${countries}</div>${links}` : "";
}

		// Only the progress updates in place; the page redraws when sending finishes or pauses.

// The same CSV reading as src/csv.ts, so the list is checked before anything is sent.
function parseCsv(text) {
	const src = text.replace(/^﻿/, ""); const first = src.split(/\r?\n/, 1)[0] || "";
	const sep = [",", ";", "\t"].map((s) => [s, first.split(s).length]).sort((a, b) => b[1] - a[1])[0][0];
	const rows = []; let row = [], cell = "", quoted = false;
	for (let i = 0; i < src.length; i++) { const c = src[i];
		if (quoted) { if (c === '"' && src[i + 1] === '"') { cell += '"'; i++; } else if (c === '"') quoted = false; else cell += c; }
		else if (c === '"' && cell === "") quoted = true; else if (c === sep) { row.push(cell); cell = ""; }
		else if (c === "\n" || c === "\r") { if (c === "\r" && src[i + 1] === "\n") i++; row.push(cell); if (row.some((x) => x.trim())) rows.push(row); row = []; cell = ""; } else cell += c; }
	row.push(cell); if (row.some((x) => x.trim())) rows.push(row); return rows;
}
const fkey = (h) => h.trim().toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "").slice(0, 40);
const SKIP = new Set("email email_address e_mail name full_name first_name firstname fname last_name lastname surname lname tags status member_rating optin_time optin_ip confirm_time confirm_ip latitude longitude gmtoff dstoff timezone cc region last_changed leid euid notes date_added date_created signup_date unsubscribed bounced complaint joined subscribed list".split(" "));
function readImport(rows) {
	if (!rows.length) return { rows: [], skipped: 0, columns: [] };
	const head = rows[0].map(fkey); let emailCol = head.findIndex((h) => ["email", "email_address", "e_mail", "mail"].includes(h)); let start = 1;
	const isEmail = (x) => /^[^\s@<>()",;:]+@[^\s@<>()",;:]+\.[a-z]{2,}$/i.test(String(x || "").trim());
	if (emailCol < 0) { emailCol = rows[0].findIndex(isEmail); start = 0; if (emailCol < 0) return { rows: [], skipped: rows.length, columns: [] }; }
	const col = (...n) => (start ? head.findIndex((h) => n.includes(h)) : -1);
	const nameCol = col("name", "full_name"), firstCol = col("first_name", "firstname", "fname"), lastCol = col("last_name", "lastname", "surname", "lname"), tagCol = col("tags");
	const extra = start ? head.map((h, i) => ({ h, i })).filter(({ h, i }) => h && !SKIP.has(h) && i !== emailCol) : [];
	const seen = new Set(); const out = []; let skipped = 0;
	for (const r of rows.slice(start)) { const email = String(r[emailCol] || "").trim().toLowerCase(); if (!isEmail(email) || seen.has(email)) { skipped++; continue; } seen.add(email);
		const joined = [r[firstCol] || "", r[lastCol] || ""].map((s) => s.trim()).filter(Boolean).join(" ");
		const fields = {}; for (const { h, i } of extra) if ((r[i] || "").trim()) fields[h] = r[i].trim();
		out.push({ email, name: ((nameCol >= 0 ? r[nameCol] : "") || joined || "").trim() || null, fields, tags: tagCol >= 0 ? (r[tagCol] || "").split(/[,;|]/).map((t) => t.trim()).filter(Boolean) : [] }); }
	return { rows: out, skipped, columns: extra.map((e) => e.h) };
}
function importer(ls, reload, pick = "") {
	const m = modal(`<h2>Import a list</h2><p>A CSV file from your old newsletter tool (Mailchimp, Sendy, Substack, Kit and others) or a spreadsheet. We find the email column ourselves.</p>
	<label>The file</label><input type="file" id="if" accept=".csv,text/csv,text/plain"><p id="ip" class="muted"></p><label>Into this list</label><select id="il">${ls.map((l) => `<option value="${l.id}" ${l.id === pick ? "selected" : ""}>${esc(l.name)}</option>`).join("")}</select>
	<label>Tag them <span class="hint">(optional)</span></label><input id="it" placeholder="such as imported">
	<label class="check"><input type="checkbox" id="ic"> Everyone on this list agreed to get emails from me</label><p class="hint">Nobody who has unsubscribed, bounced or marked you as spam is added back.</p><p class="err" id="ie"></p>
	<div class="row"><button class="btn" id="igo" disabled>${icon("upload")}Import</button><button class="btn ghost" data-close>${icon("x")}Cancel</button></div>`);
	let data = null;
	$("#if", m).onchange = async (e) => { const f = e.target.files[0]; if (!f) return; data = readImport(parseCsv(await f.text())); $("#ip", m).textContent = data.rows.length ? `${num(data.rows.length)} people found${data.skipped ? `, ${num(data.skipped)} rows skipped (no email, or a repeat)` : ""}.${data.columns.length ? ` Also keeping: ${data.columns.join(", ")}.` : ""}` : "We couldn't find any email addresses in that file."; $("#igo", m).disabled = !data.rows.length; };
	$("#igo", m).onclick = async (e) => {
		const btn = e.currentTarget; btn.disabled = true; let added = 0;
		try { for (let i = 0; i < data.rows.length; i += 1000) { const r = await api("/api/import", { body: { list: $("#il", m).value, rows: data.rows.slice(i, i + 1000), tags: $("#it", m).value.split(",").map((t) => t.trim()).filter(Boolean), consent: $("#ic", m).checked } }); added += r.added; $("#ip", m).textContent = `Imported ${num(added)} of ${num(data.rows.length)}…`; }
			m.remove(); toast(`Imported ${num(added)} people`); reload();
		} catch (err) { $("#ie", m).textContent = err.message; btn.disabled = false; }
	};
}

}

			box.innerHTML = `<div class="found">${CF_LOGO(44)}<div><b>${esc(domain)} is on Cloudflare</b><small>So we can add the records for you. It needs a Cloudflare token that can edit DNS.</small></div></div>
			<ol class="wlist">
				<li><b>Press the button below.</b> Cloudflare opens with the right permissions filled in.<br><a class="btn" href="${CF_TOKEN_URL}" target="_blank" rel="noopener">${CF_LOGO(22, "#fff")}Make a Cloudflare token${icon("ext")}</a></li>
				<li>Under <b>Zone Resources</b>, choose <b>${esc(domain)}</b>.</li>
				<li>Press <b>Continue to summary</b>, then <b>Create Token</b>.</li>
				<li><b>Copy the token</b> and paste it here.</li></ol>
			<label for="cft">Cloudflare token</label><input id="cft" type="password" autocomplete="off" data-lpignore="true">
			<p class="hint"><a href="#ses/4" id="wself">I'd rather add the records myself</a></p>`;
			next.hidden = false; next.innerHTML = `${icon("check")}Check the token and go on`;
		};
		const showOther = (host) => {
			box.innerHTML = `<div class="found"><span class="lic">${icon("list")}</span><div><b>${esc(domain)}'s DNS is ${host ? `with ${esc(host)}` : "not on Cloudflare"}</b><small>No problem. On the next step we show you each record to add${host ? ` in ${esc(host)}` : ""}, with copy buttons.</small></div></div>`;
			next.hidden = false;
		};
		if (s.sending.cloudflareDns) {
			mode = "done";
			box.innerHTML = `<div class="found">${CF_LOGO(44)}<div><b>Connected to Cloudflare</b><small>We'll add the records to ${esc(domain)} for you.</small></div><span class="okmsg">${icon("check")}</span></div>`;
			next.hidden = false;
		} else api("/api/sending/dns-host").then((h) => (h.cloudflare ? showCf() : showOther(h.host)), () => {
			box.innerHTML = `<p class="muted">We couldn't check where ${esc(domain)}'s DNS is just now.</p><div class="options"><button class="option" id="wcf"><span class="lic">${CF_LOGO(26)}</span><span><b>It's on Cloudflare</b><small>Add the records for me.</small></span></button><a class="option" href="#ses/4"><span class="lic">${icon("list")}</span><span><b>Somewhere else</b><small>Show me the records to add.</small></span></a></div>`;
			$("#wcf").onclick = showCf;
		});
		next.onclick = (e) => run(e.currentTarget, async () => {
			if (mode !== "cf") return go(4);
			try { const r = await api("/api/sending/cloudflare", { body: { token: $("#cft").value.trim() } }); toast(`Connected to ${r.zone} in Cloudflare`); go(4); } catch (err) { fail(err); }
		});
	}

	if (step === 4) {
		page("Set up Amazon SES", `<div class="found">${SES_LOGO(44)}<div><b>Amazon SES in ${esc((REGIONS.find((r) => r[0] === s.sending.region) || [, s.sending.region])[1])}</b><small>Sending from ${esc(s.fromEmail)}</small></div></div><div id="wintro"><p>One press and we do the rest:</p>
		<ul class="wlist plain"><li>${icon("check")} Add ${esc(domain)} to Amazon SES, with email signing (DKIM)</li><li>${icon("check")} Send bounces to bounce.${esc(domain)}</li><li>${icon("check")} Bring bounces and spam complaints straight back here</li>
		${s.sending.cloudflareDns ? `<li>${icon("check")} Add the DNS records to ${esc(domain)} in Cloudflare</li>` : ""}<li>${icon("check")} Ask Amazon to let you send to anyone</li></ul>
		<button class="btn big" id="wrun">${icon("cog")}Set up Amazon SES</button></div><div id="wout"></div>`,
		`<button class="btn" id="wnext" hidden>Next${icon("next")}</button>`);
		$("#wrun").onclick = (e) => run(e.currentTarget, async () => {
			try {
				const r = await api("/api/sending/ses-setup", { body: {} });
				$("#wintro").hidden = true;
				$("#wout").innerHTML = `<ul class="steps">${r.steps.map((x) => `<li class="done">${icon("check")} ${esc(x)}</li>`).join("")}</ul>${r.warnings.map((w) => `<p class="err">${esc(w)}</p>`).join("")}
				${r.dnsDone ? "" : `<h3>Now add these to ${esc(domain)}'s DNS</h3><p class="hint">In Cloudflare: your domain, DNS, Records, Add record. Turn the orange cloud off (DNS only) for the CNAMEs. <a href="https://newslettersender.com/help/amazon-ses/#dns" target="_blank" rel="noopener">Help with DNS</a></p>${sesRecs(r.records)}`}`;
				$("#wnext").hidden = false;
			} catch (err) { fail(err); }
		});
		$("#wnext").onclick = () => go(5);
	}

	if (step === 5) {
		page("Wait for Amazon to check", `<p>Amazon checks the DNS records by itself, usually within an hour. This page checks every 30 seconds, so you can leave it open or come back later.</p><div id="wstat"><p class="muted">${icon("clock")} Checking…</p></div>`,
		`<a class="btn" href="#settings/sending" id="wdone">${icon("check")}Done</a>`);
		const check = async () => {
			try {
				const r = await api("/api/sending/ses-status");
				const good = (x) => x === "SUCCESS" || x === true;
				const line = (ok, yes, no) => `<li class="${ok ? "done" : ""}">${ok ? icon("check") : icon("clock")} ${ok ? yes : no}</li>`;
				const ready = good(r.verified) && r.production;
				$("#wstat").innerHTML = `${ready ? `<p class="wready">${icon("check")} You're ready to send</p>` : ""}<ul class="steps big">
				${line(good(r.verified), `${esc(r.domain)} is verified`, `${esc(r.domain)} isn't verified yet`)}
				${line(good(r.dkim), "Email signing (DKIM) is working", "Email signing (DKIM) is waiting for the DNS records")}
				${line(good(r.bounceDomain), "Bounce address is working", "Bounce address is waiting for the DNS records")}
				${line(r.production, "Out of the sandbox, so you can send to anyone", `Amazon is looking at your request to send to anyone (usually a day). <a href="https://newslettersender.com/help/amazon-ses/#sandbox" target="_blank" rel="noopener">More about this</a>`)}</ul>
				<p class="muted">Up to ${num(r.rate)} emails a second and ${num(r.max24)} a day.</p>${ready ? `<div class="row"><a class="btn" href="#new">${icon("pencil")}Write your first email</a></div>` : ""}`;
				if (ready) { clearInterval(timer); $(".wcard h2").textContent = "All done"; }
			} catch (err) { $("#wstat").innerHTML = `<p class="err">${esc(err.message)}</p>`; }
		};
		check();
		timer = setInterval(check, 30000);
	}
}

// -- Blocklist: a suppression list of addresses, and blocked domains ----------------------------------------------
async function blocklist(type) {
	const domains = type === "domains";
	const q = { type: domains ? "domains" : "emails", q: "", page: 0 };
	const r0 = await api(`/api/blocklist?${new URLSearchParams(q)}`);
	main.innerHTML = `<h1>Blocklist</h1>
	<nav class="subtabs"><a href="#blocklist" class="${domains ? "" : "on"}">${icon("mail")}Suppression list <span class="n">${num(r0.counts.emails)}</span></a><a href="#blocklist/domains" class="${domains ? "on" : ""}">${icon("shield")}Blocked domains <span class="n">${num(r0.counts.domains)}</span></a></nav>
	<div class="info">${icon("shield")}<p>${domains ? "Nobody at these domains can sign up or be added or imported, and they're never emailed. Handy for throwaway email services, or a competitor." : "Addresses on your suppression list are never emailed, can't sign up again and are skipped when you import. Use it for anyone who's asked never to hear from you. Bounces and spam complaints are already looked after for you."}</p></div>
	<div class="row toolbar-row"><button class="btn" id="imp">${icon("upload")}Import</button><a class="btn ghost" href="/api/blocklist/export${domains ? "?type=domains" : ""}">${icon("download")}Export</a><button class="btn danger" id="all">${icon("trash")}Delete all</button><span class="grow"></span><input id="q" class="search" placeholder="${domains ? "Search domains" : "Search email addresses"}" aria-label="Search"></div>
	<div class="card flush" id="rows"></div>`;
	const paint = (r) => {
		const from = q.page * 50;
		$("#rows").innerHTML = r.rows.length ? `<div class="scroll"><table class="data"><thead><tr><th>${domains ? "Domain" : "Email"}</th><th>Status</th><th>Last update</th><th>Block attempts</th><th class="c">Delete</th></tr></thead><tbody>${r.rows.map((x) => `<tr data-v="${esc(x.value)}"><td>${esc(x.value)}</td><td>${pill("blocked")}</td><td>${ago(x.updated_at)}</td><td>${num(x.attempts)}</td><td class="c"><button class="icon-btn" data-del title="Take off the blocklist" aria-label="Take off the blocklist">${icon("trash")}</button></td></tr>`).join("")}</tbody></table></div>
			<div class="row pager"><span class="muted small">Showing ${num(from + 1)} to ${num(from + r.rows.length)}</span><span class="grow"></span>${q.page ? `<button class="btn ghost small" id="prev">${icon("back")}Previous</button>` : ""}${r.more ? `<button class="btn ghost small" id="next">Next${icon("play")}</button>` : ""}</div>`
			: `<p class="muted pad">${q.q ? "Nothing matches that search." : domains ? "No blocked domains yet." : "Nobody on your suppression list yet."}</p>`;
		$$("#rows [data-del]").forEach((b) => (b.onclick = (e) => run(e.currentTarget, async () => { await api("/api/blocklist", { body: { type: q.type, items: [b.closest("tr").dataset.v], remove: true } }); route(); })));
		$("#prev") && ($("#prev").onclick = () => { q.page--; load(); });
		$("#next") && ($("#next").onclick = () => { q.page++; load(); });
	};
	const load = async () => paint(await api(`/api/blocklist?${new URLSearchParams(q)}`));
	paint(r0);
	let t; $("#q").oninput = (e) => { clearTimeout(t); t = setTimeout(() => { q.q = e.target.value; q.page = 0; load(); }, 300); };
	$("#all").onclick = (e) => run(e.currentTarget, async () => { if (!confirm(domains ? "Take every domain off the blocklist?" : "Take everyone off your suppression list? They could then be emailed again.")) return; await api("/api/blocklist", { body: { type: q.type, remove: true, all: true } }); route(); });
	$("#imp").onclick = () => {
		const m = modal(`<h2>${domains ? "Block domains" : "Add to your suppression list"}</h2><label for="bi">${domains ? "Domains, such as example.com" : "Email addresses"} <span class="hint">(one per line, or separated by commas)</span></label><textarea id="bi" rows="8"></textarea>
		<label class="btn ghost small" style="margin:10px 0 0;width:max-content">${icon("upload")}Or choose a CSV or text file<input type="file" id="bf" accept=".csv,.txt,text/csv,text/plain" hidden></label><p class="err" id="be"></p>
		<div class="row" style="margin-top:14px"><button class="btn" id="bgo">${icon("shield")}Add to the blocklist</button><button class="btn ghost" data-close>${icon("x")}Cancel</button></div>`);
		$("#bf", m).onchange = async (e) => { const f = e.target.files[0]; if (f) $("#bi", m).value = (await f.text()).replace(/"/g, ""); };
		$("#bgo", m).onclick = (e) => run(e.currentTarget, async () => { try { const r = await api("/api/blocklist", { body: { type: q.type, items: $("#bi", m).value } }); m.remove(); toast(`${num(r.added)} added`); route(); } catch (err) { $("#be", m).textContent = err.message; } });
	};
}

// -- Settings: everything else lives here ----------------------------------------------------------------------
const SETTINGS = [["company", "Your company", "home"], ["sending", "Sending", "send"], ["lists", "Lists", "list"], ["tracking", "Tracking", "chart"], ["account", "Account", "user"]];
async function settings(section) {
	const sec = SETTINGS.some((s) => s[0] === section) ? section : "company";
	const head = `<h1>Settings</h1><nav class="subtabs">${SETTINGS.map(([k, n, i]) => `<a href="#settings/${k}" class="${k === sec ? "on" : ""}">${icon(i)}${n}</a>`).join("")}</nav>`;
	if (sec === "sending") return sending(head);
	const b = await api("/api/brand");
	if (sec === "company") {
		main.innerHTML = `${head}<form class="card" id="f"><h2>Your company or newsletter</h2>
		<label>Company or newsletter name <span class="hint">(shown at the top of the app and of every email)</span></label><input id="name" value="${esc(b.name === "My newsletter" ? "" : b.name)}" placeholder="Such as Acme Ltd or The Friday Letter"><label>Name at the top of this app <span class="hint">(optional)</span></label><input id="app_name" value="${esc(b.app_name || "")}" placeholder="Newsletter Sender"><label>From name <span class="hint">(who emails come from)</span></label><input id="from_name" value="${esc(b.from_name)}">
		<label>From address</label><input id="from_email" type="email" value="${esc(b.from_email)}"><p class="hint">On a domain you've set up for sending, such as news@yourdomain.com.</p>
		<label>Reply to <span class="hint">(optional)</span></label><input id="reply_to" type="email" value="${esc(b.reply_to || "")}">
		<label>Footer <span class="hint">(your postal address or company details; the law in many countries asks for one)</span></label><textarea id="footer" rows="2">${esc(b.footer || "")}</textarea>
		<label class="check"><input type="checkbox" id="manage_link" ${(b.footer_links ?? 1) & 1 ? "checked" : ""}> Add a "Manage your subscription" link <span class="hint">(readers change their name and lists, so fewer unsubscribe completely)</span></label>
		<label class="check"><input type="checkbox" id="forward_link" ${(b.footer_links ?? 1) & 2 ? "checked" : ""}> Add a "Forward to a friend" link <span class="hint">(a page to share the email, with a sign up button for the friend)</span></label>
		<div class="row"><div><label>Colour</label><input id="colour" type="color" value="${esc(b.colour)}" style="width:90px;padding:4px"></div><div class="grow"><label>Logo address <span class="hint">(optional, https://...)</span></label><input id="logo" value="${esc(b.logo || "")}"></div></div>
		<label class="check"><input type="checkbox" id="done_email" ${(b.done_email ?? 1) ? "checked" : ""}> Email me when a campaign finishes sending <span class="hint">(a short summary and a link to the report)</span></label>
		<label class="check"><input type="checkbox" id="archive" ${b.archive ? "checked" : ""}> Public archive of past campaigns at <a href="/archive" target="_blank">/archive</a></label>
		<p class="err" id="e"></p><button class="btn">${icon("save")}Save</button></form>`;
		$("#f").onsubmit = async (e) => { e.preventDefault(); try { await api("/api/brand", { body: { name: $("#name").value, from_name: $("#from_name").value, from_email: $("#from_email").value, reply_to: $("#reply_to").value, footer: $("#footer").value, colour: $("#colour").value, logo: $("#logo").value, archive: $("#archive").checked, app_name: $("#app_name").value, manage_link: $("#manage_link").checked, forward_link: $("#forward_link").checked, done_email: $("#done_email").checked } }); toast("Saved"); showName({ app_name: $("#app_name").value }); $("#e").textContent = ""; } catch (err) { $("#e").textContent = err.message; } };
	}
	if (sec === "lists") {
		main.innerHTML = `${head}<form class="card" id="rules"><h2>How your lists work</h2>
		<div class="rule"><div><b>Can someone be on more than one list?</b><p class="hint">Sending to several lists at once never emails anyone twice.</p></div><div class="opts"><label><input type="radio" name="one" value="0" ${b.one_list ? "" : "checked"}>Yes</label><label><input type="radio" name="one" value="1" ${b.one_list ? "checked" : ""}>No, one list each</label></div></div>
		<div class="rule"><div><b>When someone unsubscribes</b><p class="hint">The law only asks that they stop getting what they unsubscribed from. Leaving everything is the simplest.</p></div><div class="opts"><label><input type="radio" name="scope" value="all" ${b.unsub_scope === "list" ? "" : "checked"}>They leave every list</label><label><input type="radio" name="scope" value="list" ${b.unsub_scope === "list" ? "checked" : ""}>Just the list that campaign went to</label></div></div>
		<div class="row" style="margin-top:14px"><button class="btn">${icon("save")}Save</button><a class="btn ghost" href="#lists">${icon("list")}View all lists</a></div></form>`;
		$("#rules").onsubmit = (e) => { e.preventDefault(); run(e.submitter, async () => { await api("/api/brand", { body: { one_list: $("[name=one]:checked").value === "1", unsub_scope: $("[name=scope]:checked").value } }); toast("Saved"); }); };
	}
	if (sec === "tracking") {
		main.innerHTML = `${head}<form class="card" id="tf"><h2>Tracking</h2>
		<p class="muted">Both are off to start with. Bounces and spam complaints are always looked after: they come back from your sending service, show on <a href="#reports">Reports</a>, and those addresses are never emailed again.</p>
		<label class="check"><input type="checkbox" id="to" ${b.track_opens ? "checked" : ""}> <span>Track opens <span class="hint">(adds a tiny invisible picture to each email. Apple Mail opens these for everyone, so treat opens as a rough guide)</span></span></label>
		<label class="check"><input type="checkbox" id="tc" ${b.track_clicks ? "checked" : ""}> <span>Track clicks <span class="hint">(each link goes through your Newsletter Sender address first, then straight on)</span></span></label>
		<label for="td">Custom tracking domain <span class="hint">(optional)</span></label><input id="td" value="${esc(b.track_domain || "")}" placeholder="news.yourdomain.com">
		<p class="hint">Open and click links then use your own domain rather than ${esc(location.host)}, which looks better and can help delivery. Add it to this Worker in Cloudflare first: Workers, newsletter-sender, Settings, Domains and routes, Add, Custom domain.</p>
		<p class="err" id="te"></p><div class="row"><button class="btn">${icon("save")}Save</button><a class="btn ghost" href="#reports">${icon("chart")}See reports</a><a class="btn ghost" href="#settings/sending">${icon("shield")}Bounce set-up</a></div></form>`;
		$("#tf").onsubmit = async (e) => { e.preventDefault(); try { await api("/api/brand", { body: { track_opens: $("#to").checked, track_clicks: $("#tc").checked, track_domain: $("#td").value } }); toast("Saved"); $("#te").textContent = ""; } catch (err) { $("#te").textContent = err.message; } };
	}
	if (sec === "account") {
		main.innerHTML = `${head}<div class="card"><h2>Your account</h2><p>To change your password, open your set-up link again.</p><div class="row"><button class="btn ghost" id="everywhere">${icon("out")}Sign out everywhere</button>${store.get("ns.gs") ? `<button class="btn ghost" id="gsback">${icon("check")}Show getting started again</button>` : ""}</div></div>
		<div class="card"><h2>Licence</h2><p>Newsletter Sender is free for one person or organisation's own newsletters. Sending for clients, or offering it as a hosted or white label service, needs a commercial licence: <a href="https://paulobrien.dev/contact/">get in touch</a>.</p></div>`;
		$("#gsback") && ($("#gsback").onclick = () => { store.set("ns.gs", null); location.hash = "campaigns"; });
		$("#everywhere").onclick = (e) => run(e.currentTarget, async () => { await api("/api/signout-everywhere", { body: {} }); boot(); });
	}
}

// -- Reports ---------------------------------------------------------------------------------------------
async function reports() {
	const r = await api("/api/reports");
	const tr = r.tracking;
	main.innerHTML = `<div class="row"><h1 class="grow">Reports</h1><a class="btn ghost" href="#settings/tracking">${icon("cog")}Tracking settings</a></div>
	<p class="muted lead">${tr.opens || tr.clicks ? `Tracking ${[tr.opens && "opens", tr.clicks && "clicks"].filter(Boolean).join(" and ")}.` : "Opens and clicks are off. Switch them on in Settings if you'd like them."} Bounces, spam complaints and unsubscribes are always counted.</p>
	<div class="card flush">${r.emails.length ? `<div class="scroll"><table class="data"><thead><tr><th>Campaign</th><th>Recipients</th><th>Sent</th>${tr.opens ? "<th>Unique opens</th>" : ""}${tr.clicks ? "<th>Unique clicks</th>" : ""}<th>Unsubscribed</th><th>Bounced</th><th>Marked as spam</th></tr></thead><tbody>${r.emails.map((c) => `<tr><td><a href="#email/${c.id}"><b>${esc(c.name || c.subject)}</b></a></td><td>${num(c.total)}</td><td>${ago(c.started_at)}</td>${tr.opens ? `<td>${rate(c.opens, c.sent, "open")}</td>` : ""}${tr.clicks ? `<td>${rate(c.clicks, c.sent, "click")}</td>` : ""}<td>${rate(c.unsubscribed, c.sent, "")}</td><td>${rate(c.bounced, c.sent, "bad")}</td><td>${rate(c.complained, c.sent, "bad")}</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted pad">Nothing sent yet. Reports appear here after your first campaign.</p>`}</div>
	<div class="card"><h2>Bounces and spam complaints</h2><p class="hint">Hard bounces and complaints are never emailed again. A bounce "for now" (a full inbox, say) gets another try next time.</p>${r.problems.length ? `<ul class="feed">${r.problems.map((a) => `<li><time>${when(a.at)}</time>${esc(KIND[a.kind] || a.kind)}: ${esc(a.email || "")}${a.name || a.subject ? ` · ${esc(a.name || a.subject)}` : ""}${a.detail ? ` <span class="muted">(${esc(a.detail)})</span>` : ""}</li>`).join("")}</ul>` : `<p class="muted">None so far.</p>`}</div>`;
}

boot();
</script>
